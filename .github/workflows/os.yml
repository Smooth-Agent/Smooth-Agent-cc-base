name: Build and publish cc-os (base fixa)

# A base so muda quando alguem marca uma tag os-vN de proposito. Ela e importada
# UMA vez no Detona; o runtime (build.yml) e um layer em cima dela. Rebuild da base
# a cada push quebraria o diff do layer (o OS_IMAGE do runtime tem que ser a MESMA
# imagem que foi importada).
on:
  push:
    tags: ['os-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.os
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/smooth-agent/cc-os:${{ github.ref_name }}
